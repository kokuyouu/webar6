<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Задание 6 — Unity WebXR</title>
<style>
body{margin:0;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%}#unity-container{position:fixed;inset:0}.panel{position:fixed;bottom:8px;left:8px;right:8px;width:fit-content;max-width:calc(100% - 32px);padding:8px;background:white;color:black}button{min-height:32px}p{margin:6px 0;font-size:14px}p:empty{display:none}#entervr{display:none}#loading{position:fixed;top:8px;left:8px;padding:8px;background:white}#error{white-space:pre-wrap;color:#a00}
</style>
</head>
<body>
<div id="unity-container"><canvas id="unity-canvas" tabindex="0" aria-label="Unity сцена с трёхмерным кубом"></canvas></div>

<div class="panel"><button id="enterar" disabled>Запустить AR</button><button id="entervr" disabled>VR</button><p id="status">Проверяем поддержку WebXR…</p><p id="error" role="alert"></p></div>
<div id="loading"><progress id="progress" max="1" value="0"></progress><p id="load-label">Подготавливаем WebGL…</p></div>
<script>
var unityInstance = null;
var supported = false;
var canvas = document.getElementById('unity-canvas');
var statusText = document.getElementById('status');
var arButton = document.getElementById('enterar');
function setSupported(value) {
  supported=value; arButton.disabled=!value || !unityInstance;
  statusText.textContent=value?'':'AR недоступен в этом браузере.';
}
document.addEventListener('onARSupportedCheck',e=>setSupported(e.detail.supported));
if (!navigator.xr) setSupported(false);
else navigator.xr.isSessionSupported('immersive-ar').then(setSupported).catch(()=>setSupported(false));
arButton.addEventListener('click',()=>{if(unityInstance) unityInstance.Module.WebXR.toggleAR();});
var config={
 dataUrl:'Build/task6.data',
 frameworkUrl:'Build/task6.framework.js',
 codeUrl:'Build/task6.wasm',
 streamingAssetsUrl:'StreamingAssets',companyName:'MIREA',productName:'WebAR Task 6',productVersion:'1.0.0',
 devicePixelRatio:Math.min(window.devicePixelRatio||1,2),
 showBanner:function(message,type){if(type==='error'){document.getElementById('error').textContent=message;}}
};
var script=document.createElement('script');script.src='Build/task6.loader.js';
script.onload=()=>createUnityInstance(canvas,config,p=>{document.getElementById('progress').value=p;document.getElementById('load-label').textContent=Math.round(p*100)+'%';}).then(instance=>{
 unityInstance=instance;document.getElementById('loading').style.display='none';setSupported(supported);canvas.focus();document.documentElement.dataset.unityReady='true';
}).catch(message=>{document.getElementById('loading').style.display='none';document.getElementById('error').textContent=String(message);});
script.onerror=()=>{document.getElementById('load-label').textContent='Не удалось загрузить Unity. Обновите страницу.';};document.body.appendChild(script);
</script></body></html>
